name: RuntimeZero 24/7 Autonomous Ghost Founder Cron

on:
  schedule:
    # Runs everyday at 03:00 UTC (midnight EST)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 markdown python-frontmatter python-dotenv

      - name: Execute Autonomous Multi-Agent Operational Cycle
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py --cron

      - name: Commit & Push Ledger and State Updates
        run: |
          git config --global user.name "RuntimeZero Ghost Founder"
          git config --global user.email "bot@runtimezero.dev"
          git add data/ content/
          if git diff --staged --quiet; then
            echo "No autonomous changes to commit."
          else
            git commit -m "chore(dac): autonomous operational cycle & ledger update [skip ci]"
            git push
          fi
