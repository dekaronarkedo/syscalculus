name: SysCalculus Cloudflare Pages & Production Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 markdown python-frontmatter python-dotenv

      - name: Compile Static Site (build.py)
        run: |
          python build.py

      - name: Verify Build Integrity & SEO Schemas
        run: |
          python -c "import os; assert os.path.exists('dist/index.html'), 'Missing dist/index.html'; assert os.path.exists('dist/sitemap.xml'), 'Missing dist/sitemap.xml'; print('Site build verified successfully.')"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'syscalculus'
          directory: 'dist'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
